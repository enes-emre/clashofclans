<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Made in Turkey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="feed-body">

  <header class="site-nav">
    <a href="index.html" class="brand">Made in Turkey</a>

    <div class="nav-actions">
      <a href="paylas.html" class="btn-share hidden" id="shareBtn">+ Düzen Paylaş</a>
      <button id="logoutBtn" class="btn-logout hidden" type="button">Çıkış</button>
      <a href="giris.html" class="btn-share hidden" id="loginBtn">Giriş Yap</a>
    </div>
  </header>

  <main class="feed-main">
    <div class="view-tabs">
      <button type="button" class="view-tab active" id="tabAll">Tüm Düzenler</button>
      <button type="button" class="view-tab" id="tabSaved">Kaydedilenler</button>
      <button type="button" class="view-tab" id="tabFilter">Filtrele</button>
    </div>

    <div class="filter-panel hidden" id="filterPanel">
      <div class="filter-group">
        <label for="filterTownHall">Belediye binası</label>
        <select id="filterTownHall">
          <option value="">Tümü</option>
          <option value="18">TH18</option>
          <option value="17">TH17</option>
          <option value="16">TH16</option>
          <option value="15">TH15</option>
          <option value="14">TH14</option>
          <option value="13">TH13</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterBaseType">Düzen türü</label>
        <select id="filterBaseType">
          <option value="">Tümü</option>
          <option value="war_base">War Base</option>
          <option value="trophy_base">Trophy Base</option>
          <option value="for_fun">For Fun</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterUsername">Kullanıcı adı</label>
        <input type="text" id="filterUsername" placeholder="Kullanıcı adına göre ara..." />
      </div>

      <div class="filter-actions">
        <button type="button" class="primary-btn" id="filterApply">Uygula</button>
        <button type="button" class="btn-logout" id="filterClear">Temizle</button>
      </div>
    </div>

    <section class="grid" id="basesGrid">
      <p class="grid-status">Yükleniyor...</p>
    </section>

    <nav class="pagination" id="pagination" aria-label="Sayfalar"></nav>
  </main>

  <!-- Giriş gerektiren bir işlem denendiğinde çıkan bilgilendirme penceresi -->
  <div class="modal-overlay hidden" id="authModal">
    <div class="modal-box">
      <p id="authModalText">Bu işlem için giriş yapman gerekiyor.</p>
      <div class="modal-actions">
        <button type="button" class="primary-btn" id="authModalLogin">Oturum Aç</button>
        <button type="button" class="btn-logout" id="authModalCancel">Oturum açmadan devam et</button>
      </div>
    </div>
  </div>

  <script type="module" src="feed.js"></script>
</body>
</html>
